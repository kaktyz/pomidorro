[package]
name = "pomidorro"
version = "0.1.0"
edition = "2024"
description = "A macOS Pomodoro timer with a terminal UI and menu bar"
license = "MIT"

[dependencies]
anyhow = "1"
libc = "0.2"
chrono = { version = "0.4", features = ["serde"] }
crossterm = "0.28"
directories = "6"
ratatui = "0.29"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = "0.3"
objc2-foundation = "0.3"
tao = "0.37"
tray-icon = "0.26"

[profile.release]
lto = "thin"
strip = true
